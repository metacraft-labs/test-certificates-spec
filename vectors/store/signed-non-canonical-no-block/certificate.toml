# store/signed's certificate with its signature block removed, rendered
# NON-canonically. key_id is still present, so the canonical payload is still
# exactly canonical.txt, and the name is still store/signed's.
"schema" = "test-certificate.v1"

[certificate]
command = [ { argv = [ "example-test", "run", "--targets", "t-integration,t-unit" ] } ]
vcs = { content = "git-tree-sha1:9f8e7d6c5b4a3928170695e4d3c2b1a099887766", repo = "example", untracked = false }
"issuer" = 'example-runner@build-host-1'
"key_id" = 'example-key-2026-q2'
"targets" = [ 't-integration', 't-unit', ]
"result" = "passed"
"issued_at" = "2026-06-23T10:14:33Z"
"platform" = "linux/amd64"
"project" = "exam\u0070le"
"framework" = "example-framework"
